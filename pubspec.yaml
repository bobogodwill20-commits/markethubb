name: ecommerce_marketplace
description: A e-commerce marketplace app with admin, seller, and customer interfaces
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    uses-material-design: true
    sdk: flutter
  
  # Supabase & Backend
  supabase_flutter: ^2.5.0
  cross_file: ^0.3.3+8
  universal_html: ^2.2.3
  
  # Image & File Handling
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  cached_network_image: ^3.3.1
  
  # Video Player
  video_player: ^2.9.1
  chewie: ^1.8.1
  
  # UI & Styling
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  badges: ^3.1.1
  flutter_spinkit: ^5.2.0
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Charts & Analytics
  fl_chart: ^0.66.0

  
  # CSV Export & Sharing
  csv: ^5.1.1
  path_provider: ^2.1.0
  share_plus: ^7.2.2
  
  # Utilities
  intl: ^0.18.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  
  # Chat & Messaging
  flutter_chat_ui: ^1.6.12
  
  # HTTP Client
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

# Launcher Icon Configuration - Using your Free.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Free.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/Free.png"
  min_sdk_android: 21
  remove_alpha_ios: true
